name: Deploy (Production Optimized)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Tencent Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TENCENT_REGISTRY }}
          username: ${{ secrets.TENCENT_USERNAME }}
          password: ${{ secrets.TENCENT_PASSWORD }}
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./agent-frontend
          push: true
          tags: ${{ secrets.TENCENT_REGISTRY }}/ai-system-repo/frontend:latest
          # Using GHA cache is significantly faster for cross-border builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Tencent Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TENCENT_REGISTRY }}
          username: ${{ secrets.TENCENT_USERNAME }}
          password: ${{ secrets.TENCENT_PASSWORD }}
      - name: Build and push Java Backend
        uses: docker/build-push-action@v5
        with:
          context: ./java-backend
          push: true
          tags: ${{ secrets.TENCENT_REGISTRY }}/ai-system-repo/java:latest
          # Layered JARs combined with GHA cache are lightning fast
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Tencent Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TENCENT_REGISTRY }}
          username: ${{ secrets.TENCENT_USERNAME }}
          password: ${{ secrets.TENCENT_PASSWORD }}
      - name: Build and push Python Agent
        uses: docker/build-push-action@v5
        with:
          context: ./agent-python
          push: true
          tags: ${{ secrets.TENCENT_REGISTRY }}/ai-system-repo/python:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-frontend, build-java, build-python]
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Sync docker-compose.yml
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          scp -i "$HOME/.ssh/deploy_key" -P "$SERVER_PORT" docker-compose.yml "$SERVER_USER@$SERVER_HOST:/app/ai-system/docker-compose.yml"

      - name: Remote Deployment Execution
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd /app/ai-system
            
            # Legacy systemd cleanup (if necessary)
            sudo systemctl stop ai-system-java ai-system-python || true
            sudo systemctl disable ai-system-java ai-system-python || true
            
            if [ ! -f .env ]; then
              echo "Deployment halted: .env missing."
              exit 1
            fi
            
            # Pull with parallelism and update containers
            echo "[TRACE] 阶段 1: 拉取最新镜像"
            docker compose pull --quiet

            # [INTENT] 主动触发旧容器停止，打断生命周期，为内核回收 TIME_WAIT 状态及引擎释放资源创造明确的时间窗口。
            echo "[TRACE] 阶段 2: 停机排空 - 强制释放目标端口"
            docker compose stop agent-frontend || true

            # [INTENT] 智能等待机制。探活宿主机 80 端口，避免静态 sleep 拖慢 CI，最大容忍 30 秒。
            echo "[TRACE] 阶段 3: 端口状态检查与等待"
            WAIT_TIMEOUT=30
            for ((i=1; i<=WAIT_TIMEOUT; i++)); do
              if ! ss -ant | grep -qP ':(80)\b'; then
                echo "[TRACE] 端口 80 已彻底释放 (耗时: ${i}s)"
                break
              fi
              if [ "$i" -eq "$WAIT_TIMEOUT" ]; then
                echo "[WARN] 端口 80 等待超时，尝试强制执行 up"
              fi
              sleep 1
            done

            # [INTENT] 执行核心启动逻辑。结合业务“重试即成功”的特征，注入单次防抖重试机制，对冲 Compose 内部竞态残留。
            echo "[TRACE] 阶段 4: 启动容器编排"
            if ! docker compose up -d --remove-orphans; then
              echo "[TRACE] 首次启动失败，等待 5 秒缓冲状态机后触发单次重试..."
              sleep 5
              if ! docker compose up -d --remove-orphans; then
                echo "[ERROR] 致命错误：重试启动依然失败！"
                
                # [INTENT] 全量故障现场保留。摒弃旧版单点观测，捕获上下游全链路尾部日志，防范级联雪崩导致的误判。
                echo "================ 全链路异常快照 ================"
                echo ">>> Fetching logs for agent-frontend:"
                docker logs agent-frontend --tail 100 || true
                echo ">>> Fetching logs for java-backend:"
                docker logs java-backend --tail 100 || true
                echo ">>> Fetching logs for agent-python:"
                docker logs agent-python --tail 100 || true
                echo "================================================"
                exit 1
              fi
            fi
            
            # [INTENT] 环境清理
            echo "[TRACE] 阶段 5: 环境清理"
            docker image prune -f
            echo "[TRACE] 部署流程执行完毕！"
