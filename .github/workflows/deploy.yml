name: Deploy (Production Optimized)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Tencent Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TENCENT_REGISTRY }}
          username: ${{ secrets.TENCENT_USERNAME }}
          password: ${{ secrets.TENCENT_PASSWORD }}
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./agent-frontend
          push: true
          tags: ${{ secrets.TENCENT_REGISTRY }}/ai-system-repo/frontend:latest
          # Using registry cache instead of GHA cache to avoid 'exporting layers' bottleneck
          cache-from: type=registry,ref=${{ secrets.TENCENT_REGISTRY }}/ai-system-repo/frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.TENCENT_REGISTRY }}/ai-system-repo/frontend:buildcache,mode=max

  build-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Tencent Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TENCENT_REGISTRY }}
          username: ${{ secrets.TENCENT_USERNAME }}
          password: ${{ secrets.TENCENT_PASSWORD }}
      - name: Build and push Java Backend
        uses: docker/build-push-action@v5
        with:
          context: ./java-backend
          push: true
          tags: ${{ secrets.TENCENT_REGISTRY }}/ai-system-repo/java:latest
          # Layered JARs are extremely efficient with registry caching
          cache-from: type=registry,ref=${{ secrets.TENCENT_REGISTRY }}/ai-system-repo/java:buildcache
          cache-to: type=registry,ref=${{ secrets.TENCENT_REGISTRY }}/ai-system-repo/java:buildcache,mode=max

  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Tencent Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TENCENT_REGISTRY }}
          username: ${{ secrets.TENCENT_USERNAME }}
          password: ${{ secrets.TENCENT_PASSWORD }}
      - name: Build and push Python Agent
        uses: docker/build-push-action@v5
        with:
          context: ./agent-python
          push: true
          tags: ${{ secrets.TENCENT_REGISTRY }}/ai-system-repo/python:latest
          cache-from: type=registry,ref=${{ secrets.TENCENT_REGISTRY }}/ai-system-repo/python:buildcache
          cache-to: type=registry,ref=${{ secrets.TENCENT_REGISTRY }}/ai-system-repo/python:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-frontend, build-java, build-python]
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Sync docker-compose.yml
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          scp -i "$HOME/.ssh/deploy_key" -P "$SERVER_PORT" docker-compose.yml "$SERVER_USER@$SERVER_HOST:/app/ai-system/docker-compose.yml"

      - name: Remote Deployment Execution
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd /app/ai-system
            
            # Legacy systemd cleanup (if necessary)
            sudo systemctl stop ai-system-java ai-system-python || true
            sudo systemctl disable ai-system-java ai-system-python || true
            
            if [ ! -f .env ]; then
              echo "Deployment halted: .env missing."
              exit 1
            fi
            
            # Pull with parallelism and update containers
            docker compose pull --quiet
            if ! docker compose up -d --remove-orphans; then
              echo "=========== DEPLOYMENT FAILED ==========="
              echo "Fetching logs for agent-python:"
              docker logs agent-python --tail 100
              echo "========================================="
              exit 1
            fi
            
            # Purge dangling images to save disk space
            docker image prune -f
