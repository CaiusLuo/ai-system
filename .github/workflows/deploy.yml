name: Deploy (Tencent Cloud Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TENCENT_REGISTRY }}
          username: ${{ secrets.TENCENT_USERNAME }}
          password: ${{ secrets.TENCENT_PASSWORD }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./agent-frontend
          push: true
          tags: ${{ secrets.TENCENT_REGISTRY }}/ai-system-repo/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TENCENT_REGISTRY }}
          username: ${{ secrets.TENCENT_USERNAME }}
          password: ${{ secrets.TENCENT_PASSWORD }}

      - name: Build and push Java Backend
        uses: docker/build-push-action@v5
        with:
          context: ./java-backend
          push: true
          tags: ${{ secrets.TENCENT_REGISTRY }}/ai-system-repo/java:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TENCENT_REGISTRY }}
          username: ${{ secrets.TENCENT_USERNAME }}
          password: ${{ secrets.TENCENT_PASSWORD }}

      - name: Build and push Python Agent
        uses: docker/build-push-action@v5
        with:
          context: ./agent-python
          push: true
          tags: ${{ secrets.TENCENT_REGISTRY }}/ai-system-repo/python:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build-frontend, build-java, build-python]
    steps:
      - name: Checkout code (for docker-compose.yml)
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "${SERVER_SSH_KEY}" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "${SERVER_PORT}" -H "${SERVER_HOST}" >> "$HOME/.ssh/known_hosts"

      - name: Copy docker-compose.yml to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          scp -i "$HOME/.ssh/deploy_key" -P "${SERVER_PORT}" docker-compose.yml "${SERVER_USER}@${SERVER_HOST}:/app/ai-system/docker-compose.yml"

      - name: Deploy via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd /app/ai-system
            
            # Stop existing systemd services if they are running (Migration only)
            sudo systemctl stop ai-system-java ai-system-python || true
            sudo systemctl disable ai-system-java ai-system-python || true
            
            # Ensure .env exists
            if [ ! -f .env ]; then
              echo "Error: .env file not found in /app/ai-system/. Please create it from .env.example"
              exit 1
            fi
            
            # Pull latest images and restart containers
            docker compose pull
            docker compose up -d --remove-orphans
            
            # Cleanup old images
            docker image prune -f
