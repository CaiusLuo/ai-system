name: Deploy (Docker)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: "${{ github.repository_owner }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./agent-frontend
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/ai-system-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Java Backend
        uses: docker/build-push-action@v5
        with:
          context: ./java-backend
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/ai-system-java:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Python Agent
        uses: docker/build-push-action@v5
        with:
          context: ./agent-python
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/ai-system-python:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code (for docker-compose.yml)
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "${SERVER_SSH_KEY}" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -p "${SERVER_PORT}" -H "${SERVER_HOST}" >> "$HOME/.ssh/known_hosts"

      - name: Copy docker-compose.yml to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          scp -i "$HOME/.ssh/deploy_key" -P "${SERVER_PORT}" docker-compose.yml "${SERVER_USER}@${SERVER_HOST}:/app/ai-system/docker-compose.yml"

      - name: Deploy via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: GITHUB_REPOSITORY_OWNER
          script: |
            set -e
            cd /app/ai-system
            
            # Stop existing systemd services if they are running (First time only)
            sudo systemctl stop ai-system-java ai-system-python || true
            sudo systemctl disable ai-system-java ai-system-python || true
            
            # Ensure .env exists
            if [ ! -f .env ]; then
              echo "Error: .env file not found in /app/ai-system/. Please create it from .env.example"
              exit 1
            fi
            
            # Pull latest images and restart containers
            docker compose pull
            docker compose up -d --remove-orphans
            
            # Cleanup old images
            docker image prune -f
